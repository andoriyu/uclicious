[package]
name = "uclicious"
version = "0.10.1"
publish = ["crates-io"]
authors = ["Andrey Cherkashin <andoriyu@gmail.com>"]
edition = "2018"
categories = ["config"]
keywords = ["config", "uclicious", "ucl", "libucl"]
description = "Uclicious is a wrapper around Universal Configuration Library (UCL) parser with a lot of sugar."
license = "BSD-2-Clause"
repository = "https://github.com/andoriyu/uclicious"
homepage = "https://github.com/andoriyu/uclicious"
readme = "README.md"

[dependencies]
libucl-bind = { package = "uclicious-libucl-sys", version = "0.9.2", path = "uclicious-libucl-sys" }
bitflags = "1.2.1"
uclicious_derive = { path = "uclicious_derive", optional = true, version = "=0.10.1" }
libc = "0.2"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
uclicious_derive = { path = "uclicious_derive", version = "=0.10.1" }

[features]
vh_env = []
vh_compound = []
vh_basic = ["vh_env", "vh_compound"]
default = ["derive", "vh_basic"]
derive = ["uclicious_derive"]

[[example]]
name = "leak-test"
crate-type = ["bin"]

[workspace]
resolver = "2"
members = ["uclicious_derive", "uclicious-libucl-sys", "uclicious-example"]
