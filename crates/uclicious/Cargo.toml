[package]
name = "uclicious"
version = "0.9.1"
authors = ["Andrey Cherkashin <andoriyu@gmail.com>"]
edition = "2018"
categories = ["config"]
keywords = ["config", "uclicious", "ucl", "libucl"]
description = "Uclicious is a wrapper around Universal Configuration Library (UCL) parser with a lot of sugar."
license = "BSD-2-Clause"
repository = "https://github.com/andoriyu/uclicious"
homepage = "https://github.com/andoriyu/uclicious"
readme = "README.md"

[dependencies]
libucl-bind = { package = "uclicious-libucl-sys", version = "0.9.1", path = "../uclicious-libucl-sys", registry = "coldsteel" }
bitflags = "1.2.1"
uclicious_derive = { path = "../uclicious-derive", optional = true, version = "=0.9.1", registry = "coldsteel" }
libc = "0.2"

[dev-dependencies]
uclicious_derive = { path = "../uclicious-derive", version = "=0.9.1", registry = "coldsteel" }

[features]
vh_env = []
vh_compound = []
vh_basic = ["vh_env", "vh_compound"]
default = ["derive", "vh_basic"]
derive = ["uclicious_derive"]

[[example]]
name = "leak-test"
crate-type = ["bin"]
