[package]
name = "uclicious-libucl-sys"
version = "0.9.4"
publish = ["coldsteel"]
description = "Low-level FFI bindings to libucl (0.9.x), linked via pkg-config."
authors = [
  "Łukasz Niemier <lukasz@niemier.pl>",
  "Igor Laćarac <draftsix@gmail.com>",
  "Andrey Cherkashin <andoriyu@gmail.com>",
]
edition = "2018"
license-file = "LICENSE"
repository = "https://github.com/andoriyu/uclicious-libucl-sys"
build = "build.rs"
links = "ucl"

[dependencies]
libc = "0.2.66"
bitflags = "1.2"

[features]
# Internal: builds the C fixture that this workspace's reference-count tests
# link against. Consumers never need it.
refcount-test-fixture = []

[build-dependencies]
pkg-config = "0.3.17"
cc = "1"
