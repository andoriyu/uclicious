name: Checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: nix develop --command cargo test --workspace --all-features --locked
      - name: Documentation without native libraries
        env:
          DOCS_RS: "1"
          LIBUCL_NO_PKG_CONFIG: "1"
        run: nix develop --command cargo doc --workspace --no-deps --locked
