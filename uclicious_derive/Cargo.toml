[package]
name = "uclicious_derive"
version = "0.10.1"
publish = ["crates-io"]
authors = ["Andrey Cherkashin <andoriyu@gmail.com>"]
edition = "2018"
license = "BSD-2-Clause"
categories = ["config"]
keywords = ["config", "uclicious", "derive"]
